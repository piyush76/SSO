server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}
    session:
      timeout: ${SESSION_TIMEOUT}

# Application Configuration
app:
  sso:
    endpoint-url: ${SSO_ENDPOINT_URL}
  session:
    timeout: ${SESSION_TIMEOUT}

# CORS Configuration for Hazcom Website
cors:
  allowed-origins: ${HAZCOM_WEBSITE_URL}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  allow-credentials: true

spring:
  application:
    name: hazcom-sso-service
  security:
    saml2:
      relyingparty:
        registration:
          azure-ad:
            signing:
              credentials:
                - private-key-location: ${SP_KEY_LOCATION}
                  certificate-location: ${SP_CERT_LOCATION}
            assertingparty:
              entity-id: ${IDP_ENTITY_ID}
              verification:
                credentials:
                  - certificate-location: ${IDP_CERT_LOCATION}
              singlesignon:
                url: ${IDP_SSO_URL}
                sign-request: ${SIGN_REQUESTS:false}
            entity-id: ${SP_ENTITY_ID}
            acs:
              bindings:
                - POST
              location: ${SP_ACS_URL}
