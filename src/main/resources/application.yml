server:
  port: 8080
  servlet:
    context-path: /sso
    session:
      timeout: ${app.session.timeout:10m}

# Application Configuration
app:
  sso:
    endpoint-url: ${SSO_ENDPOINT_URL:/login/saml2/sso/azure-ad}
  session:
    timeout: ${SESSION_TIMEOUT:10m}

# CORS Configuration for Hazcom Website
cors:
  allowed-origins: ${HAZCOM_WEBSITE_URL:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  allow-credentials: true

spring:
  application:
    name: hazcom-sso-service
  security:
    saml2:
      relyingparty:
        registration:
          azure-ad:
            signing:
              credentials:
                - private-key-location: classpath:saml/private.key
                  certificate-location: classpath:saml/public.crt
            assertingparty:
              entity-id: ${AZURE_AD_ENTITY_ID}
              verification:
                credentials:
                  - certificate-location: classpath:saml/azure-ad.crt
              singlesignon:
                url: ${AZURE_AD_SSO_URL}
                sign-request: true
            entity-id: ${SERVICE_PROVIDER_ENTITY_ID}
  security:
    saml2:
      relyingparty:
        registration:
          azure-ad:
            signing:
              credentials:
                - private-key-location: classpath:saml/private.key
                  certificate-location: classpath:saml/public.crt
            assertingparty:
              entity-id: ${AZURE_AD_ENTITY_ID}
              verification:
                credentials:
                  - certificate-location: classpath:saml/azure-ad.crt
              singlesignon:
                url: ${AZURE_AD_SSO_URL}
                sign-request: true
            entity-id: ${SERVICE_PROVIDER_ENTITY_ID}
            acs:
              bindings:
                - POST
              location: "{baseUrl}/login/saml2/sso/azure-ad"
